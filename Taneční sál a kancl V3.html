<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taneční sál</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: celoobrazovková 3D scéna; ovládací panely se vznášejí po okrajích. Akcent je žlutá barva dveří sálu. */
  :root {
    --bg: #e8eaec;
    --fg: #1c2024;
    --muted: #5b646c;
    --panel: rgba(250, 251, 252, 0.9);
    --line: #c9cfd4;
    --accent: #e0a928;
    --on-accent: #221a06;
    --scene: #dde1e4;
    --floor-map: #d9b27a;
    --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a; --fg: #e9ecee; --muted: #98a2aa;
      --panel: rgba(24, 28, 32, 0.88); --line: #343c43; --scene: #1a1e22; --floor-map: #6b4a22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a; --fg: #e9ecee; --muted: #98a2aa;
    --panel: rgba(24, 28, 32, 0.88); --line: #343c43; --scene: #1a1e22; --floor-map: #6b4a22;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; min-width: 0; }
  .title { padding: 12px 14px 10px; }
  h1 { margin: 0; font-size: 1.15rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .dim { margin: 4px 0 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #map { display: block; width: 200px; height: 74px; max-width: 100%; }
  .note { margin: 8px 0 0; font-size: 0.7rem; line-height: 1.35; color: var(--muted); max-width: 200px; }

  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button { font: 500 0.82rem var(--display); color: var(--fg); background: transparent; border: 0; border-radius: 7px; padding: 8px 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  #light { flex-wrap: wrap; justify-content: flex-end; }
  #light button { padding: 8px 9px; font-size: 0.78rem; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 55%, rgba(8, 10, 14, 0) 52%, rgba(8, 10, 14, 0.8) 100%); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bottom { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .bottom > * { pointer-events: auto; max-width: 100%; }
  .views { display: flex; gap: 4px; padding: 4px; overflow-x: auto; }
  .views button { flex: none; font: 500 0.8rem var(--display); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .views button:hover { border-color: var(--line); }
  .views button.on { background: var(--accent); color: var(--on-accent); }
  .hint { margin: 0; font-size: 0.72rem; color: var(--muted); text-align: center; text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }

  .pad { position: absolute; right: 16px; bottom: 96px; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; }
  .pad button { font: 500 1.1rem var(--display); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .pad button:active { background: var(--accent); color: var(--on-accent); }
  .pad [data-dir="f"] { grid-column: 2; grid-row: 1; }
  .pad [data-dir="l"] { grid-column: 1; grid-row: 2; }
  .pad [data-dir="b"] { grid-column: 2; grid-row: 2; }
  .pad [data-dir="r"] { grid-column: 3; grid-row: 2; }
  .pad[hidden] { display: none; }
  @media (max-width: 520px) { .top { flex-direction: column; align-items: stretch; } .seg { align-self: flex-end; } .title { align-self: flex-start; } .pad { bottom: 100px; } }
  @media (max-width: 520px) { .top { flex-direction: column-reverse; } }
  #app { background: #0b0c0e; }
  #gl, .vig, .tint { right: auto; bottom: auto; }
  .tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #5d86d0; mix-blend-mode: soft-light; }
  .side { position: absolute; left: 16px; bottom: 96px; width: 236px; max-height: calc(100% - 300px); overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .sec { padding: 8px 10px; font-size: 0.78rem; }
  .sec summary { cursor: pointer; font-weight: 700; font-size: 0.85rem; }
  .sec label { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font: 0.7rem var(--mono); }
  .sec input[type=range] { width: 100%; accent-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chips button, .sec select { font: 500 0.75rem var(--display); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
  .chips button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chips button:disabled { opacity: .4; cursor: default; }
  .sec select { width: 100%; margin-top: 6px; background: var(--panel); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="app">
  <canvas id="gl" aria-label="3D model tanečního sálu"></canvas>
  <div class="vig" id="vig"></div>
  <div class="tint" id="tint"></div>

  <div class="top">
    <div class="panel title">
      <h1>Taneční sál</h1>
      <p class="dim">Sál 18 × 6 m · místnost 6 × 3,5 m</p>
      <canvas id="map"></canvas>
      <p class="note">Orientační model podle fotek, ne přesná kopie.</p>
    </div>
    <div class="right">
      <div class="panel seg" role="group" aria-label="Režim pohledu">
        <button type="button" data-mode="walk" class="on">Procházka</button>
        <button type="button" data-mode="cam">Kamera</button>
        <button type="button" data-mode="top">Shora</button>
      </div>
      <div class="panel seg" id="light" role="group" aria-label="Světelná atmosféra">
        <button type="button" data-tod="day" class="on">Den 5600 K</button>
        <button type="button" data-tod="warm">Teplé 2800 K</button>
        <button type="button" data-tod="gloom">Ponuré, chladné</button>
        <button type="button" data-tod="neutral">Bez efektů</button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="Pohyb">
    <button type="button" data-dir="f" aria-label="Dopředu">↑</button>
    <button type="button" data-dir="l" aria-label="Doleva">←</button>
    <button type="button" data-dir="b" aria-label="Dozadu">↓</button>
    <button type="button" data-dir="r" aria-label="Doprava">→</button>
  </div>

  <div class="side">
    <details class="panel sec" id="camP" hidden open><summary>Kamera</summary>
      <label>Ohnisko <b id="vF"></b></label><input type="range" id="iF" min="12" max="125" step="1" value="35">
      <div class="chips" id="fChips"></div>
      <label>Výška <b id="vH"></b></label><input type="range" id="iH" min="0.1" max="3.7" step="0.05" value="1.6">
      <label>Sklon nahoru/dolů <b id="vP"></b></label><input type="range" id="iP" min="-85" max="85" step="1" value="0">
      <label>Náklon (roll) <b id="vR"></b></label><input type="range" id="iR" min="-45" max="45" step="1" value="0">
      <div class="chips"><button type="button" id="rRoll">Vyrovnat horizont</button></div>
      <label>Poměr stran</label><select id="iA"></select>
      <p class="note" id="camInfo"></p>
      <p class="note">Plný formát 36 mm · R/F mění výšku</p>
    </details>
    <details class="panel sec" id="figP" open><summary>Postavy</summary>
      <label>Póza (vybrané / nové)</label><div class="chips" id="poseChips"></div>
      <div class="chips"><button type="button" id="fAdd">+ Přidat postavu</button></div>
      <label>Postavy</label><div class="chips" id="figList"></div>
      <label>Otočení <b id="vY"></b></label><input type="range" id="iY" min="0" max="359" step="1" value="0">
      <div class="chips"><button type="button" id="fDel">Smazat vybranou</button><button type="button" id="fClr">Smazat vše</button></div>
      <p class="note">Při otevřeném panelu můžeš postavy přetahovat po podlaze.</p>
    </details>
  </div>

  <div class="bottom">
    <div class="panel views" id="views" role="group" aria-label="Místa v sále"></div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(function () {
  var L = 18, W = 6, H = 3.9, EYE = 1.6, D = 3.5, DZ = 0.85, LT = L + D;
  var PI = Math.PI;

  /* ---------- pomocné funkce ---------- */
  function cv(w, h, draw, repeat) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    return t;
  }
  function seeded(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  function slatTex(wm, hm) {
    return cv(32, 64, function (g, w, h) {
      g.fillStyle = '#241e1a'; g.fillRect(0, 0, w, h);
      var gr = g.createLinearGradient(0, 14, 0, h);
      gr.addColorStop(0, '#caa072'); gr.addColorStop(1, '#a87a4b');
      g.fillStyle = gr; g.fillRect(0, 14, w, h - 14);
      var r = seeded(7);
      g.strokeStyle = 'rgba(90,55,25,.25)'; g.lineWidth = 1;
      for (var i = 0; i < 6; i++) { var y = 18 + r() * (h - 22); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (r() - .5) * 2); g.stroke(); }
    }, [1, hm / 0.09]);
  }
  function floorTex() {
    return cv(256, 256, function (g, w, h) {
      g.fillStyle = '#b9782b'; g.fillRect(0, 0, w, h);
      var r = seeded(11);
      for (var i = 0; i < 90; i++) {
        g.fillStyle = 'rgba(' + (r() > .5 ? '255,200,120' : '90,45,10') + ',' + (0.03 + r() * 0.05) + ')';
        g.beginPath(); g.ellipse(r() * w, r() * h, 20 + r() * 50, 6 + r() * 16, r() * PI, 0, 2 * PI); g.fill();
      }
      for (var sj = 0; sj < 46; sj++) {
        g.strokeStyle = 'rgba(255,226,170,' + (0.05 + r() * 0.09).toFixed(3) + ')'; g.lineWidth = 0.6;
        var sx0 = r() * w, sy0 = r() * h, sa = r() * PI, sl = 10 + r() * 42;
        g.beginPath(); g.moveTo(sx0, sy0); g.lineTo(sx0 + Math.cos(sa) * sl, sy0 + Math.sin(sa) * sl); g.stroke();
      }
      g.fillStyle = 'rgba(70,35,8,.55)'; g.fillRect(0, h - 2, w, 2);
    }, [L / 6, W / 1.5]);
  }
  function ceilTex() {
    return cv(16, 16, function (g, w, h) {
      g.fillStyle = '#f4f0e7'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#cdc5b3'; g.fillRect(0, h - 2, w, 2);
    }, [1, W / 0.14]);
  }
  function blindTex(hm) {
    return cv(16, 32, function (g, w, h) {
      g.fillStyle = '#e4e8ea'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#9ea8ad'; g.fillRect(0, h - 4, w, 4);
    }, [1, hm / 0.05]);
  }
  function curtainTex() {
    return cv(512, 64, function (g, w, h) {
      g.clearRect(0, 0, w, h);
      for (var x = 0; x < w; x++) {
        var a = 0.5 + 0.5 * Math.sin(x / w * 2 * PI * 38) * Math.sin(x / w * 2 * PI * 7 + 1);
        g.fillStyle = 'rgba(255,255,255,' + (0.34 + 0.3 * a).toFixed(3) + ')';
        g.fillRect(x, 0, 1, h);
      }
    });
  }
  function mirrorTex() {
    return cv(8, 256, function (g, w, h) {
      var gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, '#dfe7ea'); gr.addColorStop(0.35, '#c4d0d5'); gr.addColorStop(0.62, '#b7a58f');
      gr.addColorStop(0.72, '#b27d3c'); gr.addColorStop(1, '#a56d2b');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
  }
  function clockTex() {
    return cv(128, 128, function (g) {
      g.fillStyle = '#5a3a28'; g.beginPath(); g.arc(64, 64, 63, 0, 2 * PI); g.fill();
      g.fillStyle = '#f7f7f4'; g.beginPath(); g.arc(64, 64, 54, 0, 2 * PI); g.fill();
      g.strokeStyle = '#222'; g.lineWidth = 3;
      for (var i = 0; i < 12; i++) { var a = i * PI / 6; g.beginPath(); g.moveTo(64 + Math.sin(a) * 46, 64 - Math.cos(a) * 46); g.lineTo(64 + Math.sin(a) * 52, 64 - Math.cos(a) * 52); g.stroke(); }
      g.lineWidth = 4; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.sin(2.7) * 28, 64 - Math.cos(2.7) * 28); g.stroke();
      g.lineWidth = 3; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.sin(0.15) * 42, 64 - Math.cos(0.15) * 42); g.stroke();
    });
  }

  /* ---------- scéna ---------- */
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(70, 1, 0.05, 200);

  function readScene() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#dde1e4';
    scene.background = new THREE.Color(v);
  }
  readScene();
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', function () { readScene(); mapDirty = true; });

  var ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
  var hemi = new THREE.HemisphereLight(0xffffff, 0xb08a5a, 0.4); scene.add(hemi);
  var lights = [];   /* {l, base, zone: hall|room, kind: ceil (stropní) | win (světlo z oken)} */
  function addLight(x, y, z, base, dist, zone, kind) {
    var p = new THREE.PointLight(0xfff3e0, kind === 'ceil' ? base : 0, dist, 1);
    p.position.set(x, y, z); scene.add(p);
    lights.push({ l: p, base: base, zone: zone, kind: kind });
  }
  [4, 9, 14].forEach(function (x) { addLight(x, H - 0.4, W / 2, 0.32, 13, 'hall', 'ceil'); });
  [2, 5.5, 9, 12.5, 16].forEach(function (x) { addLight(x, 2.4, W - 0.7, 1, 11, 'hall', 'win'); });

  var mat = {
    wall: new THREE.MeshLambertMaterial({ color: 0xf3f3ef }),
    floor: new THREE.MeshStandardMaterial({ map: floorTex(), roughness: 0.28, metalness: 0.04 }),
    ceil: new THREE.MeshLambertMaterial({ map: ceilTex() }),
    lamp: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    frame: new THREE.MeshLambertMaterial({ color: 0xf6f6f3 }),
    wood: new THREE.MeshLambertMaterial({ color: 0xb98150 }),
    doorLeaf: new THREE.MeshLambertMaterial({ color: 0xe0a928 }),
    doorFrame: new THREE.MeshLambertMaterial({ color: 0x5b1f16 }),
    metal: new THREE.MeshLambertMaterial({ color: 0xb9bec2 }),
    glass: new THREE.MeshBasicMaterial({ color: 0xcfd9dd }),
    black: new THREE.MeshLambertMaterial({ color: 0x25272a })
  };
  var mirrorMap = mirrorTex();
  var mirrorA = new THREE.MeshBasicMaterial({ map: mirrorMap, color: 0xffffff });
  var mirrorB = new THREE.MeshBasicMaterial({ map: mirrorMap, color: 0xefefef });

  function add(m) { scene.add(m); return m; }
  function plane(w, h, material, x, y, z, rx, ry) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h, Math.min(40, Math.max(1, Math.ceil(w / 0.7))), Math.min(14, Math.max(1, Math.ceil(h / 0.7)))), material);
    m.position.set(x, y, z); m.rotation.x = rx || 0; m.rotation.y = ry || 0; return add(m);
  }
  function box(w, h, d, material, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x, y, z); return add(m);
  }
  function cyl(r, len, material, x, y, z, axis) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), material);
    m.position.set(x, y, z);
    if (axis === 'x') m.rotation.z = PI / 2; else if (axis === 'z') m.rotation.x = PI / 2;
    return add(m);
  }

  /* podlaha a strop (plochy jsou jednostranné, takže shora jsou průhledné) */
  plane(L, W, mat.floor, L / 2, 0, W / 2, -PI / 2, 0);
  plane(L, W, mat.ceil, L / 2, H, W / 2, PI / 2, 0);

  /* stěny, vždy lícem do sálu */
  plane(L, H, mat.wall, L / 2, H / 2, 0, 0, 0);              /* zrcadlová stěna */
  plane(L, H, mat.wall, L / 2, H / 2, W, 0, PI);             /* okenní stěna */
  /* konec A: celá lamely, s otvorem pro dveře do vedlejší místnosti */
  var slatFull = new THREE.MeshLambertMaterial({ map: slatTex(1, H), color: 0xffffff });
  var slatTop = new THREE.MeshLambertMaterial({ map: slatTex(1, H - 2.2), color: 0xffffff });
  plane(DZ - 0.46, H, slatFull, L, H / 2, (DZ - 0.46) / 2, 0, -PI / 2);
  plane(W - (DZ + 0.46), H, slatFull, L, H / 2, DZ + 0.46 + (W - (DZ + 0.46)) / 2, 0, -PI / 2);
  plane(0.92, H - 2.2, slatTop, L, 2.2 + (H - 2.2) / 2, DZ, 0, -PI / 2);
  plane(W, H, mat.wall, 0, H / 2, W / 2, 0, PI / 2);          /* konec B: bílá nahoře */
  plane(W, 2.1, new THREE.MeshLambertMaterial({ map: slatTex(1, 2.1) }), 0.002, 1.05, W / 2, 0, PI / 2);  /* konec B: pás lamel */

  /* stropní svítidla */
  for (var row = 0; row < 2; row++) {
    for (var i = 0; i < 6; i++) plane(0.6, 0.6, mat.lamp, 1.6 + i * 3, H - 0.003, row ? 4.4 : 1.7, PI / 2, 0);
  }

  /* skutečné odrazy: THREE.Reflector vykreslí sál z druhé strany zrcadla; bez skriptu zůstanou statická zrcadla */
  var HAS_REFL = !!THREE.Reflector, reflectors = [], mirQuads = [];
  var DPRR = Math.min(window.devicePixelRatio || 1, 1.5);
  var RTW = Math.max(512, Math.min(1600, Math.round(window.innerWidth * DPRR * 0.8)));
  var RTH = Math.max(384, Math.min(1000, Math.round(window.innerHeight * DPRR * 0.8)));
  function makeMirror(geo, x, y, z, rx, ry, opt) {
    if (!HAS_REFL) return null;
    var oo = { color: new THREE.Color(0.47, 0.49, 0.5), textureWidth: RTW, textureHeight: RTH, clipBias: 0.003 };
    if (opt && opt.shader) oo.shader = opt.shader;
    var r = new THREE.Reflector(geo, oo);
    r.position.set(x, y, z); r.rotation.set(rx || 0, ry || 0, 0);
    if (opt && opt.soft) { r.material.transparent = true; r.material.depthWrite = false; r.renderOrder = 2; }
    add(r); reflectors.push(r); return r;
  }
  function wire(pts, col) {
    var g = new THREE.BufferGeometry().setFromPoints(pts.map(function (q) { return new THREE.Vector3(q[0], q[1], q[2]); }));
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: col || 0xb9bcbf })));
  }

  /* zrcadla s tyčemi na dlouhé stěně */
